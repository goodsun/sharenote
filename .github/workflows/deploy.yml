name: Deploy

on:
  push:
    branches:
      - production
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Set environment
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "CDK_ENV=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" = "refs/heads/production" ]; then
            echo "CDK_ENV=prod" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "CDK_ENV=dev" >> $GITHUB_ENV
          else
            echo "CDK_ENV=dev" >> $GITHUB_ENV
          fi

      - name: Set CDK account
        run: |
          if [ "${{ env.CDK_ENV }}" = "prod" ]; then
            echo "CDK_ACCOUNT=${{ secrets.CDK_ACCOUNT_PROD }}" >> $GITHUB_ENV
          elif [ "${{ env.CDK_ENV }}" = "stg" ]; then
            echo "CDK_ACCOUNT=${{ secrets.CDK_ACCOUNT_STG }}" >> $GITHUB_ENV
          else
            echo "CDK_ACCOUNT=${{ secrets.CDK_ACCOUNT_DEV }}" >> $GITHUB_ENV
          fi

      - name: Load environment variables
        run: |
          # Google Client ID
          if [ "${{ env.CDK_ENV }}" = "prod" ]; then
            echo "GOOGLE_CLIENT_ID_PROD=${{ secrets.GOOGLE_CLIENT_ID_PROD }}" >> $GITHUB_ENV
            echo "ENCRYPTION_KEY_PROD=${{ secrets.ENCRYPTION_KEY_PROD }}" >> $GITHUB_ENV
          elif [ "${{ env.CDK_ENV }}" = "stg" ]; then
            echo "GOOGLE_CLIENT_ID_STG=${{ secrets.GOOGLE_CLIENT_ID_STG }}" >> $GITHUB_ENV
            echo "ENCRYPTION_KEY_STG=${{ secrets.ENCRYPTION_KEY_STG }}" >> $GITHUB_ENV
          else
            echo "GOOGLE_CLIENT_ID_DEV=${{ secrets.GOOGLE_CLIENT_ID_DEV }}" >> $GITHUB_ENV
            echo "ENCRYPTION_KEY_DEV=${{ secrets.ENCRYPTION_KEY_DEV }}" >> $GITHUB_ENV
          fi

      - name: Deploy all
        run: |
          # シンプルなデプロイスクリプトを実行
          # ローカルと同じ手順で実行される
          ./scripts/deploy-simple.sh
        env:
          CDK_ENV: ${{ env.CDK_ENV }}
          CDK_ACCOUNT: ${{ env.CDK_ACCOUNT }}
          CDK_REGION: ap-northeast-1